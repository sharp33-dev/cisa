<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="정보시스템 감리사 학습">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- 배경 (마스커블 세이프존 고려: 콘텐츠는 중앙 80%) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 문서 카드 (감리 산출물) -->
  <g>
    <rect x="132" y="108" width="216" height="272" rx="22" fill="url(#doc)"/>
    <!-- 접힌 모서리 -->
    <path d="M300 108 h48 v48 z" fill="#cbd5e1"/>
    <!-- 체크리스트 라인 -->
    <g fill="#1e3a8a">
      <rect x="168" y="168" width="120" height="16" rx="8"/>
      <rect x="168" y="210" width="150" height="14" rx="7" fill="#94a3b8"/>
      <rect x="168" y="248" width="150" height="14" rx="7" fill="#94a3b8"/>
      <rect x="168" y="286" width="110" height="14" rx="7" fill="#94a3b8"/>
    </g>
    <!-- 체크 마크 (감사 완료) -->
    <circle cx="196" cy="330" r="18" fill="#0ea5e9"/>
    <path d="M187 330 l7 8 l13 -16" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 돋보기 (감리·점검) -->
  <g stroke="#38bdf8" fill="none" stroke-width="26" stroke-linecap="round">
    <circle cx="332" cy="316" r="66" fill="#0f172a"/>
    <line x1="382" y1="366" x2="424" y2="408"/>
  </g>
  <path d="M312 316 l14 16 l26 -32" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
