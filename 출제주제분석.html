## 2. 출제 경향 요약

**(1) 사업관리(1~10번대 전반) — 이론·계산 고정 출제** PMBOK 기반 원가(EVM)·일정(CPM/PERT)·품질(COQ)·리스크·인적자원(동기부여·팀개발)·조직구조가 매년 순환한다. 특히 EVM과 CPM 계산은 **매년 반드시 1~2문항** 출제되므로 최우선 학습 대상이다.

**(2) 감리 제도·법규(10번대 후반~20번대) — 지침 개정 추적 필수** 정보시스템 감리기준(별표1 감리대가·별표2 기술평가·제10조 종료단계), 전자정부법 시행령(행정처분·감리대상), 감리원 윤리, SW대가산정, 공공데이터/DB 표준화가 반복된다. 지침 개정 연도가 문제에 직접 반영되므로 **최신 개정본 확인**이 중요하다.

**(3) 2024년 이후 신규 트렌드 — AI/클라우드** AI 학습용 데이터 품질관리, 초거대 AI 도입 가이드, 고영향 AI 판단, LLM 지표(ROUGE-L), SW대가산정 AI 커스터마이징형, 클라우드 네이티브 발주 안내서 등 **AI·클라우드 관련 신규 지침**이 2024년부터 급증. 2026년에는 6문항 이상 출제되어 향후 최대 변수로 부상.

## 2. 출제 경향 요약

**(1) 설계·구현 영역 — 코드·다이어그램 실전형 고정 출제** UML(클래스·시퀀스·상태), GoF 디자인 패턴, SOLID 원칙, 리팩토링/코드 냄새는 **매년 다수 출제**되는 핵심 축이다. Java/C/C++/Python 코드 추적 문제도 매년 '상' 난이도로 등장한다.

**(2) 테스트·품질 영역 — 계산 문제 최다** 커버리지(문장·조건·결정·MC/DC·경로) 계산과 McCabe 순환복잡도 계산은 **매년 반드시** 출제된다. ISO/IEC 9126→25010 품질특성, CMMI/SPICE/SP인증 성숙도, 신뢰성·가용성 계산이 반복된다.

**(3) 2023년 이후 신규 트렌드 — AI·MSA·클라우드** 인공신경망 테스트 커버리지, 메타모픽 테스팅, AI 강건성, ISO 22989 AI 신뢰성, Concolic 테스팅 등 **AI 소프트웨어 품질/테스트**가 급증. 아키텍처도 MSA·CQRS·컨테이너·Clean Architecture 중심으로 이동. SysML, Git, ITIL 4도 비중 확대.

## 2. 출제 경향 요약

**(1) 이론·계산 균형 — SQL·관계대수·정규화 3대 축** SQL 결과 판정(부속질의·조인·GROUP BY·NULL 처리), 관계대수 연산 결과(차수·카디널리티·디비전), 정규화(함수종속·후보키·BCNF)가 **매년 각 2~4문항씩** 출제되는 절대적 핵심이다. 반복 훈련으로 확실히 득점 가능한 영역이다.

**(2) 트랜잭션·저장구조 — 원리 이해형** 동시성 제어(격리수준·로킹·2PL·타임스탬프), 회복 기법(체크포인트·WAL·REDO/UNDO), 인덱스/해싱/B+트리 구조가 매년 등장한다. 격리수준별 이상현상(dirty/phantom read)과 로킹 호환성 행렬은 단골이다.

**(3) 데이터 분석·빅데이터 — 비중 확대** 데이터마이닝(연관규칙 지지도·신뢰도, 의사결정트리 Gini, 나이브베이즈, k-Means), 정보검색(정밀도·재현율·TF-IDF), NoSQL·CAP·HDFS·Spark·MapReduce가 최근 크게 확대되었다.

## 2. 출제 경향 요약

**(1) 네트워크 — 최대 비중** 라우팅(RIP·OSPF·BGP), TCP/UDP·전송계층, 서브네팅·IP주소·NAT, IPv6가 매년 다수 출제되어 시스템구조의 절반 가까이를 차지한다. 서브네팅 주소 계산, TCP 순서/확인번호 계산, 오류검출(CRC·해밍) 계산은 매년 나오는 확실한 계산형 소재다.

**(2) 컴퓨터구조·OS — 원리·계산형** 캐시·가상메모리·페이지교체(LRU/LFU/FIFO), CPU 성능·파이프라인 해저드·스케줄링, RAID 레벨, 수체계·2의보수·불대수가 반복된다. 2024~2026년에는 논리회로·부동소수점·암달의 법칙 등 컴퓨터구조 기초 계산이 눈에 띄게 늘었다.

**(3) 신기술 — AI/클라우드 비중 급증** 머신러닝·딥러닝(과적합·활성화함수·CNN/RNN/GAN)은 이미 고정 출제 영역이며, 2023년 이후 트랜스포머·GPT/BERT·전이학습·LLM 미세조정(LoRA)·양자컴퓨팅 등 최신 AI가 급증했다. 가상화도 컨테이너(Docker)·전가상화/반가상화 중심으로 이동했고, 클라우드·SDN·하둡/Spark 빅데이터 인프라도 꾸준하다.

## 2. 출제 경향 요약

**(1) 개인정보보호·법규 — 최대 비중, 매년 3~5문항** 개인정보보호법·정보통신망법, 비식별/가명정보 조치(k-익명성·l-다양성·t-근접성), 안전성 확보조치 기준, OECD 8원칙이 매년 다수 출제된다. 법 개정이 문제에 직접 반영되므로 **최신 법령 확인**이 중요하다.

**(2) 웹·시스템 취약점과 암호 — 실전형 고정 출제** XSS·CSRF·SQL Injection·파일 업로드·버퍼오버플로 등 웹/시스템 취약점과 대응(시큐어코딩)이 매년 나온다. 암호는 대칭/공개키(RSA·ECC·ElGamal)·해시·블록암호 운용모드(CBC·CTR·GCM)·전자서명·PKI가 반복되며, 정량적 위험분석(SLE·ALE·ARO) 계산도 단골이다.

**(3) 신기술 보안 — 비중 급증** 블록체인·암호화폐(소프트/하드포크·블록헤더·이클립스 공격)가 2019년 이후 매년 출제되고, 2022년부터 AI/ML 보안(모델 역전·데이터 포이즈닝·적대적 예제), 제로 트러스트, 클라우드 보안(책임공유모델·API 보안), IoT 보안, 동형암호·ABAC 등 최신 주제가 급증했다.

<script>
(function(){
  const YEAR_RE = /'(\d{2})-Q(\d+)|·\s*Q(\d+)|,\s*Q(\d+)/g;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function inline(s){ // bold + escape
    return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  }
  function linkify(cellText){
    let last=null;
    return cellText.replace(YEAR_RE,function(m,yy,n1,n2,n3){
      let year,num;
      if(yy){year='20'+yy;num=n1;last=year;}
      else {if(!last)return m;year=last;num=(n2||n3);}
      return '<a class="xref" data-target="y'+year+'q'+num+'">'+esc(m)+'</a>';
    });
  }
  function starsWrap(t){ return t.indexOf('★')>=0 ? '<span class="stars">'+esc(t)+'</span>' : inline(t); }
  function badge(t){
    const v=t.trim();
    if(['계산','법규','점검','개념','분류','코드추적'].includes(v)) return '<span class="badge b-'+v+'">'+v+'</span>';
    return inline(t);
  }
  function renderMD(md){
    const lines=md.split('\n');
    let html='', i=0, para=[], quote=[];
    function flushPara(){ if(para.length){html+='<p>'+para.map(inline).join(' ')+'</p>';para=[];} }
    function flushQuote(){ if(quote.length){html+='<div class="lead">'+quote.map(q=>'<div>'+inline(q)+'</div>').join('')+'</div>';quote=[];} }
    while(i<lines.length){
      let ln=lines[i];
      if(/^\s*\|/.test(ln)){
        flushPara();flushQuote();
        // collect table
        let rows=[];
        while(i<lines.length && /^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
        html+=renderTable(rows);
        continue;
      }
      if(ln.startsWith('### ')){flushPara();flushQuote();html+='<h3>'+inline(ln.slice(4))+'</h3>';i++;continue;}
      if(ln.startsWith('## ')){flushPara();flushQuote();html+='<h2>'+inline(ln.slice(3))+'</h2>';i++;continue;}
      if(ln.startsWith('# ')){i++;continue;}
      if(ln.startsWith('> ')){flushPara();quote.push(ln.slice(2));i++;continue;}
      if(/^---\s*$/.test(ln)){flushPara();flushQuote();i++;continue;}
      if(ln.trim()===''){flushPara();flushQuote();i++;continue;}
      para.push(ln.trim());i++;
    }
    flushPara();flushQuote();
    return html;
  }
  function splitRow(r){
    let c=r.trim();
    if(c.startsWith('|'))c=c.slice(1);
    if(c.endsWith('|'))c=c.slice(0,-1);
    return c.split('|').map(x=>x.trim());
  }
  function renderTable(rows){
    if(rows.length<2)return '';
    const header=splitRow(rows[0]);
    const isYearTbl = header[0]==='년도' && header.includes('문항');
    let body='';
    for(let r=2;r<rows.length;r++){
      const cells=splitRow(rows[r]);
      if(cells.every(x=>/^-*$/.test(x)))continue;
      if(isYearTbl){
        const year=cells[0], num=cells[1];
        const id='y'+year+'q'+num;
        body+='<tr id="'+id+'" data-search="'+esc((cells[2]||'')).toLowerCase()+' '+esc((cells[3]||'')).toLowerCase()+'">';
        body+='<td class="c-yr">'+esc(year)+'</td>';
        body+='<td class="c-num">'+esc(num)+'</td>';
        body+='<td>'+inline(cells[2]||'')+'</td>';
        body+='<td>'+badge(cells[3]||'')+'</td>';
        body+='<td>'+linkify(cells[4]||'')+'</td>';
        body+='<td class="c-exam"><button class="exam-btn" data-year="'+esc(year)+'" data-num="'+esc(num)+'" title="'+esc(year)+'년 '+esc(num)+'번 기출해설 새 탭으로 열기">해설 ▶</button></td>';
        body+='</tr>';
      } else {
        body+='<tr>';
        for(let c=0;c<cells.length;c++){
          let cell=cells[c];
          if(/'\d{2}-Q|·\s*Q\d|,\s*Q\d/.test(cell)) body+='<td>'+linkify(cell)+'</td>';
          else body+='<td>'+starsWrap(cell)+'</td>';
        }
        body+='</tr>';
      }
    }
    let ths=header.map(h=>'<th>'+esc(h)+'</th>').join('');
    if(isYearTbl) ths+='<th class="c-exam">기출해설</th>';
    let thead='<tr>'+ths+'</tr>';
    return '<div class="tbl-scroll"><table>'+thead+body+'</table></div>';
  }

  // ---- subjects ----
  const blocks=[].slice.call(document.querySelectorAll('script[type="text/markdown"]'));
  const subjects=blocks.map(b=>({name:b.getAttribute('data-subject'),slug:b.getAttribute('data-slug'),md:b.textContent}));
  const subjSel=document.getElementById('subjSel'), contentEl=document.getElementById('content');
  let active=0, curSlug='';

  function param(k){const m=new RegExp('[?&]'+k+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1]):null;}

  function buildSelect(){
    subjSel.innerHTML='';
    subjects.forEach((s,idx)=>{
      const o=document.createElement('option');
      o.value=idx; o.textContent=s.name;
      subjSel.appendChild(o);
    });
    subjSel.value=active;
  }
  subjSel.addEventListener('change',()=>{active=parseInt(subjSel.value,10)||0;render();});
  function render(){
    subjSel.value=active;
    curSlug=subjects[active].slug;
    contentEl.innerHTML=renderMD(subjects[active].md);
    document.getElementById('q').value='';
    filter('');
    window.scrollTo(0,0);
  }
  function filter(term){
    term=(term||'').trim().toLowerCase();
    document.querySelectorAll('tr[data-search]').forEach(tr=>{
      tr.style.display = (!term || tr.getAttribute('data-search').indexOf(term)>=0) ? '' : 'none';
    });
  }
  document.getElementById('q').addEventListener('input',e=>filter(e.target.value));
  contentEl.addEventListener('click',e=>{
    // 기출해설 실제 페이지를 새 탭으로 열기
    const eb=e.target.closest('.exam-btn');
    if(eb){
      const year=eb.getAttribute('data-year');
      const num=eb.getAttribute('data-num');
      const url=encodeURIComponent(curSlug)+'/'+encodeURIComponent(curSlug+'_'+year+'.html')+'#q'+num;
      window.open(url,'_blank','noopener');
      return;
    }
    // 유사문제 → 도착 행 이동 + 지속 강조
    const a=e.target.closest('a.xref'); if(!a)return;
    const id=a.getAttribute('data-target'); const el=document.getElementById(id);
    if(el){
      document.querySelectorAll('tr.xref-focus').forEach(r=>r.classList.remove('xref-focus','pulse'));
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('xref-focus','pulse');
      setTimeout(()=>el.classList.remove('pulse'),1200);
    }
  });

  // initial subject from ?subject=slug or name
  const wanted=param('subject');
  if(wanted){const k=subjects.findIndex(s=>s.slug===wanted||s.name===wanted);if(k>=0)active=k;}
  buildSelect();
  render();
})();
</script>
