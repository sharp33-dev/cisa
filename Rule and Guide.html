# 감리 및 사업관리 — 출제 법령·가이드 통합 정리 (2016~2026)

> 기출(2016~2026)에 출제된 법령·지침·가이드를 **연도·버전에 무관하게** 하나로 통합했다.
> 같은 문서가 해마다 다른 버전으로 나온 경우 **하나로 묶고**, 소관기관·최신본·출제년도·학습 포인트를 정리했다.
> **⚠ 개정추적** = 연도별 버전이 자주 바뀌어 **시험 시점 최신 개정본 확인이 필수**인 문서.

## 0. 학습 우선순위 요약

| 우선순위 | 문서군 | 이유 |
|---|---|---|
| ★★★★★ | 정보시스템 감리기준(고시) — 별표1 대가·별표2 기술평가·제10조 종료·상주·인력배치 | 매년 다수 출제, 조문·별표 직접 인용 |
| ★★★★★ | 정보시스템 감리 수행가이드(NIA) | 현장감리·종료단계·부적합판정·과업이행점검 매년 |
| ★★★★★ | SW사업 대가산정 가이드 | FP·투입공수·재개발·AI 대가 매년, ⚠개정추적 |
| ★★★★☆ | 전자정부법 및 시행령 | 감리대상·행정처분·장애대응 |
| ★★★★☆ | 행정기관 및 공공기관 정보시스템 구축·운영지침 | ⚠개정 잦음 |
| ★★★★☆ | 공공데이터 관리지침 / 공공DB 표준화 지침 | 데이터 영역 고정 출제 |
| ★★★☆☆ | 감리원 윤리 가이드 | 최근 5년 연속 |
| ★★★☆☆ | AI·클라우드 신규 가이드 | 2024년 이후 급증 |

## 10. ⚠ 개정 추적 필수 문서 (버전별 답 변동 주의)

시험 응시 시점 기준 **최신 개정본을 반드시 확인**해야 하는 문서:

1. **정보시스템 감리기준** (별표1·별표2·제10조) — 대가 계수·보정비율 변동 가능
2. **행정기관 및 공공기관 정보시스템 구축·운영 지침** — 거의 매년 개정
3. **SW사업 대가산정 가이드** — 매년 개정판, AI 대가 항목 신설
4. **전자정부 성과관리 지침** — 사전협의·절차 개정
5. **ISP·ISMP 수립 공통가이드** — 판(版) 개정(6판→8판)
6. **AI 데이터 품질관리 가이드라인** — 반기~연 단위 버전업(v3.0→v3.5)
7. **국가계약법 시행령·시행규칙** — 상용SW 직접구매 등 신설(2026.1.2.)
8. **용역계약 일반조건** — 계약예규 개정(지체상금 기준)

> 과거 기출의 정답이 현행 개정으로 달라질 수 있으므로, 각 문항 학습 시 **출제 당시 기준 vs 현행 기준**을 구분해 정리할 것.

---

**[출처]** 사용자 학습 정리본 「감리 및 사업관리 관련 법령.md」(2016~2026 출제 목록) 통합·재분류. 최신 개정일자는 원문 표기 기준.
</script>

<script>
(function(){
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmtText(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
  function inline(s){
    let out='',lastIdx=0,m;const re=/`([^`]+)`/g;
    while((m=re.exec(s))){out+=fmtText(s.slice(lastIdx,m.index));out+='<code>'+esc(m[1])+'</code>';lastIdx=re.lastIndex;}
    out+=fmtText(s.slice(lastIdx));return out;
  }
  function cellHTML(c){if(c.indexOf('★')>=0)return '<span class="stars">'+esc(c)+'</span>';return inline(c);}
  function splitRow(r){let c=r.trim();if(c.startsWith('|'))c=c.slice(1);if(c.endsWith('|'))c=c.slice(0,-1);return c.split('|').map(x=>x.trim());}
  function renderTable(rows){
    if(rows.length<2)return '';
    const header=splitRow(rows[0]);
    let thead='<tr>'+header.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>';
    let body='';
    for(let r=2;r<rows.length;r++){const cells=splitRow(rows[r]);if(cells.every(x=>/^-*$/.test(x)))continue;body+='<tr>'+cells.map(c=>'<td>'+cellHTML(c)+'</td>').join('')+'</tr>';}
    return '<div class="tbl-scroll"><table>'+thead+body+'</table></div>';
  }
  function renderMD(md){
    const lines=md.split('\n');let html='',i=0,para=[],quote=[],list=null,listTag='';
    function flushPara(){if(para.length){html+='<p>'+para.map(inline).join(' ')+'</p>';para=[];}}
    function flushQuote(){if(quote.length){html+='<div class="lead">'+quote.map(q=>'<div>'+inline(q)+'</div>').join('')+'</div>';quote=[];}}
    function flushList(){if(list){html+='<'+listTag+'>'+list.map(li=>'<li>'+inline(li)+'</li>').join('')+'</'+listTag+'>';list=null;listTag='';}}
    function flushAll(){flushPara();flushQuote();flushList();}
    while(i<lines.length){
      let ln=lines[i];
      if(/^\s*\|/.test(ln)){flushAll();let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}html+=renderTable(rows);continue;}
      if(ln.startsWith('### ')){flushAll();html+='<h3>'+inline(ln.slice(4))+'</h3>';i++;continue;}
      if(ln.startsWith('## ')){flushAll();html+='<h2>'+inline(ln.slice(3))+'</h2>';i++;continue;}
      if(ln.startsWith('# ')){i++;continue;}
      if(ln.startsWith('> ')){flushPara();flushList();quote.push(ln.slice(2));i++;continue;}
      let um=ln.match(/^\s*[-*]\s+(.*)$/);let om=ln.match(/^\s*\d+\.\s+(.*)$/);
      if(um){flushPara();flushQuote();if(listTag!=='ul'){flushList();listTag='ul';list=[];}list.push(um[1]);i++;continue;}
      if(om){flushPara();flushQuote();if(listTag!=='ol'){flushList();listTag='ol';list=[];}list.push(om[1]);i++;continue;}
      if(/^---\s*$/.test(ln)){flushAll();i++;continue;}
      if(ln.trim()===''){flushAll();i++;continue;}
      para.push(ln.trim());i++;
    }
    flushAll();return html;
  }
  document.getElementById('content').innerHTML=renderMD(document.getElementById('md').textContent);
})();
</script>
</body>
</html>
